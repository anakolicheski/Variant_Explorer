services:
  variant-db:
    build: .
    image: variant-explorer:latest
    platform: linux/amd64
    container_name: variant-explorer
    ports:
      - "3838:3838"
    volumes:
      # ── Patient data (stays on your machine, never inside the image) ────────
      - ./annotations:/app/annotations
      - ./New_genotypes:/app/New_genotypes

      # ── Persistent app state ────────────────────────────────────────────────
      # Candidate list, column layouts, protein-domain cache, and the optional
      # Phenotypes.xlsx / cram_paths.xlsx all live in this one folder, so
      # nothing is lost when the container is rebuilt or recreated.
      - ./app_state:/app/app_state

    restart: unless-stopped

    # Increase memory limit if needed for large datasets
    # mem_limit: 8g

    environment:
      - SHINY_LOG_LEVEL=WARN
